name: Build SynthWorld 321 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - synthia-whole-computer-v1-apk

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout SynthWorld
        uses: actions/checkout@v4

      - name: Install Godot Android export settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config"
          rm -rf "$HOME/.config/godot"
          cp -a /root/.config/godot "$HOME/.config/godot"
          rm -rf "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/4.3.stable"
          test -s /root/debug.keystore
          grep -n 'export/android' "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Validate Godot project
        working-directory: game
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --quit

      - name: Build Android APK
        working-directory: game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../build
          godot --headless --export-debug "Android" ../build/SynthWorld-321.apk
          test -s ../build/SynthWorld-321.apk

      - name: Upload SynthWorld APK
        uses: actions/upload-artifact@v4
        with:
          name: SynthWorld-321-APK
          path: build/SynthWorld-321.apk
          if-no-files-found: error
          retention-days: 30
