name: Build SynthWorld APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout SynthWorld
        uses: actions/checkout@v4
      - name: Install Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          cp -r /root/.local/share/godot/export_templates/4.3.stable/* ~/.local/share/godot/export_templates/4.3.stable/ || true
      - name: Build APK
        working-directory: game
        run: |
          mkdir -p ../build
          godot --headless --editor --quit
          godot --headless --export-debug "Android" ../build/SynthWorld.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SynthWorld-APK
          path: build/SynthWorld.apk
          if-no-files-found: error
